<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Informasi Mahasiswa</h2>
        <form id="formMahasiswa">
            <div class="form-row">
                <div class="form-group">
                    <label for="nim">NIM <span>*</span></label>
                    <input type="text" id="nim" placeholder="Masukkan NIM" value="" required>
                </div>
                <div class="form-group">
                    <label for="nama">Nama Lengkap <span>*</span></label>
                    <input type="text" id="nama" placeholder="Masukkan Nama Lengkap" value="" required>
                </div>
            </div>
            <div class="form-group foto-group">
                <label>Foto Mahasiswa</label>
                <div class="upload-area">
                    <div class="avatar" id="preview">
                        <span></span>
                    </div>
                    <div class="file-area">
                        <input type="file" id="foto" accept=".jpg,.jpeg,.png,.webp">
                        <small>
                            Format JPG, PNG, atau WEBP.
                            Maksimal 2 MB.
                        </small>
                        <p id="errorFoto"></p>
                    </div>
                </div>
            </div>
            <div class="button-group">
                <button type="reset" class="btn-reset">
                    Reset
                </button>

                <button type="submit" class="btn-simpan">
                    Simpan
                </button>
            </div>
            <p id="pesan"></p>
        </form>
    </div>

    <script src="script.js"></script>

</body>

</html>
