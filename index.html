<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>▣ Informasi Mahasiswa</h2>

        <form id="formMahasiswa">

            <div class="form-row">

                <div class="form-group">
                    <label>NIM *</label>
                    <input type="text" id="nim" placeholder="Masukkan NIM" required>
                </div>

                <div class="form-group">
                    <label>Nama Lengkap *</label>
                    <input type="text" id="nama" placeholder="Masukkan Nama Lengkap" required>
                </div>

            </div>

            <button type="submit">Simpan Data</button>

            <button type="button" id="btnReset">Reset</button>

        </form>

        <!-- Hasil Data -->
        <div id="hasilData" style="display: none;">

            <h2>Data Mahasiswa</h2>

            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>NIM</th>
                        <th>Nama Lengkap</th>
                    </tr>
                </thead>

                <tbody id="tabelMahasiswa"></tbody>
            </table>

            <h2>Data Kelompok</h2>

            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Anggota Kelompok</th>
                    </tr>
                </thead>

                <tbody id="tabelKelompok"></tbody>
            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
